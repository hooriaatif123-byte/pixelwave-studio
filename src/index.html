<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pixelwave Studio</title>
  <base href="/">

  <!-- Responsive Meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO Meta Tags -->
  <meta name="description" content="Pixelwave Studio – Creative Digital Agency specializing in web design, branding, and modern UI/UX solutions.">
  <meta name="keywords" content="Pixelwave Studio, web design, UI UX, portfolio, creative agency, front-end, Angular">
  <meta name="author" content="Pixelwave Studio">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #ffffff;
      color: #222222;
      overflow-x: hidden;
    }

    /* === PRELOADER === */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e1e2f, #23233a);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #preloader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      text-align: center;
      color: #fff;
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: 2px;
      position: relative;
    }

    .loader::after {
      content: "";
      display: block;
      width: 40px;
      height: 40px;
      border: 4px solid #fff;
      border-top: 4px solid #00bcd4;
      border-radius: 50%;
      margin: 20px auto 0;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- === Preloader === -->
  <div id="preloader">
    <div class="loader">
      Pixelwave Studio
    </div>
  </div>

  <!-- === Angular App === -->
  <app-root></app-root>

  <!-- === Preloader Script === -->
  <script>
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      preloader.classList.add('fade-out');
      setTimeout(() => preloader.style.display = 'none', 600);
    });
  </script>
</body>
</html>
