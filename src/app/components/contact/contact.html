<section class="contact" id="contact">
  <div class="container contact-container">
    <h2 class="section-title">Get in <span>Touch</span></h2>
    <p class="section-subtitle">
      Let’s create something amazing together. Fill out the form or reach us directly.
    </p>

    <div class="contact-grid">
      <!-- 📧 Contact Info -->
      <div class="contact-info">
        <h3>Contact Information</h3>
        <p><strong>Email:</strong> hello@pixelwave.com</p>
        <p><strong>Phone:</strong> +92 300 1234567</p>
        <p><strong>Location:</strong> Lahore, Pakistan</p>
      </div>

      <!-- 📝 Contact Form -->
      <form class="contact-form" (submit)="onSubmit($event)">
        <div class="form-group">
          <input type="text" placeholder="Your Name" required />
        </div>
        <div class="form-group">
          <input type="email" placeholder="Your Email" required />
        </div>
        <div class="form-group">
          <textarea placeholder="Your Message" rows="5" required></textarea>
        </div>
        <button class="btn" type="submit">Send Message</button>
      </form>
    </div>
  </div>
</section>
